<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Area | Segun Samuel</title>
<meta name="description" content="Student dashboard for enrolled Segun Samuel learning experiences, courses and progress.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://greaterheight.github.io/Thesegunsamuel/student/">
<link rel="stylesheet" href="/Thesegunsamuel/assets/css/styles.css">
<style>
.student-wrap{max-width:1180px;margin:auto;padding:70px 24px}
.student-hero{background:#003020;color:#fff;padding:44px;border-radius:18px;margin-bottom:28px}
.student-hero h1{color:#fff}
.student-hero p{color:#d6e1dc}
.student-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.student-card{background:#fff;border:1px solid #ddd6cc;border-radius:16px;padding:24px}
.student-card h2,.student-card h3{color:#003020}
.student-card p{color:#333}
.progress{height:10px;background:#e8e3db;border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:#8c0d0c}
.course-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.student-btn{display:inline-block;padding:12px 18px;border-radius:8px;background:#8c0d0c;color:#fff!important;text-decoration:none}
.student-btn.secondary{background:#003020}
@media(max-width:800px){.student-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav data-site-nav></nav>
<main class="student-wrap">
<section class="student-hero">
<p>STUDENT AREA</p>
<h1>Welcome back, Student.</h1>
<p>Your learning journey, courses and progress are in one place.</p>
</section>
<section class="student-grid">
<article class="student-card"><h3>ACTIVE COURSES</h3><p><strong id="course-count">0</strong></p></article>
<article class="student-card"><h3>OVERALL PROGRESS</h3><p><strong id="overall-progress">0%</strong></p></article>
<article class="student-card"><h3>LESSONS COMPLETED</h3><p><strong id="lessons-completed">0 / 0</strong></p></article>
</section>
<section style="margin-top:30px">
<h2>MY COURSES</h2>
<div id="courses"></div>
</section>
</main>
<footer data-site-footer></footer>
<script src="/Thesegunsamuel/js/site-shell.js"></script>
<script>
(async function(){
  try {
    const r = await fetch('/Thesegunsamuel/student/data/student-state.json', {cache:'no-store'});
    const d = await r.json();
    const courses = d.enrollments || [];
    document.getElementById('course-count').textContent = courses.length;
    if (courses.length) {
      const avg = Math.round(courses.reduce((s,c)=>s+c.progress,0)/courses.length);
      document.getElementById('overall-progress').textContent = avg + '%';
      document.getElementById('lessons-completed').textContent =
        courses.reduce((s,c)=>s+c.completedLessons,0) + ' / ' +
        courses.reduce((s,c)=>s+c.totalLessons,0);
    }
    document.getElementById('courses').innerHTML = courses.length ? courses.map(c => `
      <article class="student-card" style="margin-top:18px">
        <p>ENROLLED COURSE</p>
        <h2>${c.title}</h2>
        <p>${c.lastLesson ? 'Continue from: '+c.lastLesson : 'Ready to begin.'}</p>
        <div class="progress"><span style="width:${Number(c.progress)||0}%"></span></div>
        <p><strong>${Number(c.progress)||0}% complete</strong> · ${c.completedLessons}/${c.totalLessons} lessons</p>
        <div class="course-actions">
          <a class="student-btn" href="/Thesegunsamuel/courses/${c.courseId}/">CONTINUE LEARNING</a>
          <a class="student-btn secondary" href="/Thesegunsamuel/learning-paths/">LEARNING PATHS</a>
        </div>
      </article>`).join('') :
      '<article class="student-card"><h2>No enrolled courses yet.</h2><p>Explore the learning catalogue to begin.</p><a class="student-btn" href="/Thesegunsamuel/courses/">BROWSE COURSES</a></article>';
  } catch (e) {
    document.getElementById('courses').innerHTML =
      '<article class="student-card"><h2>Student area unavailable</h2><p>Please try again later.</p></article>';
  }
})();
</script>
</body>
</html>
