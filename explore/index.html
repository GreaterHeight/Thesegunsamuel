<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore the Knowledge Graph | Segun Samuel</title>
<meta name="description" content="Explore relationships among Segun Samuel frameworks, courses, insights and podcast knowledge.">
<link rel="canonical" href="https://greaterheight.github.io/Thesegunsamuel/explore/">
<link rel="stylesheet" href="/Thesegunsamuel/assets/css/styles.css">
<style>
.explore-wrap{max-width:1180px;margin:auto;padding:60px 24px}.search{width:100%;padding:14px;border:1px solid #cfc7bc;border-radius:8px;font:inherit}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.node{background:#fff;border:1px solid #ddd6cc;border-radius:14px;padding:20px}.node h2{color:#003020}.node a{color:#8c0d0c}
@media(max-width:850px){.results{grid-template-columns:1fr}}
</style></head><body><nav data-site-nav></nav>
<main class="explore-wrap"><p>EXPLORE</p><h1>Knowledge Graph</h1>
<p>Search across connected intellectual and learning entities.</p>
<input id="q" class="search" placeholder="Search frameworks, courses, insights…" aria-label="Search knowledge graph">
<div id="results" class="results"></div></main><footer data-site-footer></footer>
<script src="/Thesegunsamuel/js/site-shell.js"></script><script>
(async function(){
 const d=await (await fetch('/Thesegunsamuel/explore/data/knowledge-graph.json')).json();
 const out=document.getElementById('results'), q=document.getElementById('q');
 function render(){
  const s=q.value.toLowerCase().trim();
  const nodes=d.nodes.filter(n=>(n.label+' '+n.type).toLowerCase().includes(s));
  out.innerHTML=nodes.map(n=>'<article class="node"><p>'+n.type.toUpperCase()+'</p><h2>'+n.label+'</h2><a href="'+n.url+'">OPEN →</a></article>').join('');
 }
 q.addEventListener('input',render); render();
})();
</script></body></html>
