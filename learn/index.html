<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEARN | Segun Samuel</title>
<meta name="description" content="Courses, learning paths and masterclasses connected to the wider ecosystem.">
<style>
:root{--cream:#fdfaf4;--green:#003020;--soft:#eaf5f1;--wine:#8c0d0c}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--green);font-family:Arial,sans-serif}
main{max-width:1180px;margin:auto;padding:64px 22px 90px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
h1{font-family:Georgia,serif;font-size:clamp(2.8rem,7vw,5.6rem);line-height:1.02;margin:.4rem 0 .8rem}
.tagline{font-family:Georgia,serif;font-size:1.5rem;max-width:800px}
.intro{max-width:800px;line-height:1.7;font-size:1.05rem}
.toolbar{margin:34px 0 20px;display:flex;gap:10px;flex-wrap:wrap}
input{width:min(560px,100%);padding:15px 16px;border:1px solid rgba(0,48,32,.25);border-radius:8px;font:inherit}
.status{margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:white;border:1px solid rgba(0,48,32,.14);border-radius:12px;padding:21px;min-height:220px;display:flex;flex-direction:column}
.type{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.card h2{font-family:Georgia,serif;font-size:1.4rem;margin:.5rem 0}
.card p{line-height:1.55;flex:1}
a{color:var(--wine);font-weight:700;text-decoration:none}
.empty{padding:28px;background:var(--soft);border-radius:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){main{padding:45px 16px}.grid{grid-template-columns:1fr}}
</style>

<style id="v3133-pillar-refinement">
:root{--cream:#fdfaf4;--green:#003020;--deep:#0d3d28;--soft:#eaf5f1;--wine:#8c0d0c}
body{background:var(--cream);color:var(--green)}
.v3133-hero{background:var(--soft);border-radius:0 0 18px 18px;padding:54px 30px 48px;margin:0 0 34px}
.v3133-hero .eyebrow{color:var(--wine)}
.v3133-hero h1{margin:.35rem 0 .65rem}
.v3133-toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:28px 0 18px}
.v3133-count{font-size:.82rem;letter-spacing:.04em;font-weight:700}
.v3133-card{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.v3133-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,48,32,.09);border-color:rgba(0,48,32,.25)}
.v3133-card a{display:inline-flex;align-items:center;gap:6px}
</style>

</head>
<body>
<nav class="v3131-ecosystem-nav" aria-label="Primary ecosystem navigation">
  <a href="/Thesegunsamuel/">HOME</a>
  <a href="/Thesegunsamuel/learn/">LEARN</a>
  <a href="/Thesegunsamuel/think/">THINK</a>
  <a href="/Thesegunsamuel/apply/">APPLY</a>
  <a href="/Thesegunsamuel/listen/">LISTEN</a>
</nav>
<main class="v3133-main">
<div class="v3133-hero"><div class="eyebrow">Segun Samuel · Knowledge Ecosystem</div>
<h1>LEARN</h1>
<p class="tagline">Build capability. Develop practical intelligence.</p>
<p class="intro">Courses, learning paths and masterclasses connected to the wider ecosystem.</p></div>
<div class="v3133-toolbar"><div class="toolbar">
<label for="filter" style="position:absolute;left:-10000px">Filter LEARN</label>
<input id="filter" type="search" placeholder="Filter this ecosystem..." autocomplete="off">
</div><div class="v3133-count" id="pillarCount"></div></div>
<div id="status" class="status">0 available experiences</div>
<section id="grid" class="grid"><div class="empty">No canonical experiences are currently mapped to this pillar.</div></section>
</main>
<script>
const input=document.getElementById('filter'), cards=[...document.querySelectorAll('.card')], status=document.getElementById('status');
input.addEventListener('input',()=>{
 const q=input.value.toLowerCase().trim(); let n=0;
 cards.forEach(c=>{const ok=!q||c.innerText.toLowerCase().includes(q);c.hidden=!ok;if(ok)n++;});
 status.textContent=n+' available experience'+(n===1?'':'s')+(q?' matching “'+q+'”':'');
});
</script>

<script>
(function(){
 const status=document.getElementById('status');
 const count=document.getElementById('pillarCount');
 if(!status||!count)return;
 const sync=()=>{count.textContent=status.textContent};
 sync();
 new MutationObserver(sync).observe(status,{childList:true,characterData:true,subtree:true});
})();
</script>

</body>
</html>
