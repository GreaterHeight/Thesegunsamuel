<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | Segun Samuel</title>
<meta name="description" content="Checkout for Segun Samuel learning products.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://greaterheight.github.io/Thesegunsamuel/checkout/">
<link rel="stylesheet" href="/Thesegunsamuel/assets/css/styles.css">
<style>
.checkout-wrap{max-width:1000px;margin:auto;padding:60px 24px}.checkout-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}
.checkout-card{background:#fff;border:1px solid #ddd6cc;border-radius:16px;padding:24px}.checkout-card h1,.checkout-card h2{color:#003020}
.method{border:1px solid #ddd6cc;border-radius:10px;padding:14px;margin:10px 0}.method label{display:flex;gap:10px;align-items:center}
.checkout-btn{display:inline-block;border:0;background:#8c0d0c;color:#fff;padding:13px 18px;border-radius:8px;cursor:pointer}
.notice{background:#f3eee7;padding:14px;border-radius:10px;color:#333}
@media(max-width:800px){.checkout-grid{grid-template-columns:1fr}}
</style></head>
<body><nav data-site-nav></nav>
<main class="checkout-wrap">
<div class="checkout-grid">
<section class="checkout-card"><p>CHECKOUT</p><h1>Complete your enrollment</h1>
<p class="notice">This static checkout is the frontend contract for the future secure payment service. No payment is processed by this GitHub Pages build.</p>
<h2>PAYMENT METHOD</h2>
<div class="method"><label><input type="radio" name="method" checked> Paystack</label></div>
<div class="method"><label><input type="radio" name="method"> Stripe</label></div>
<div class="method"><label><input type="radio" name="method"> Bank Transfer</label></div>
<div class="method"><label><input type="radio" name="method"> WhatsApp / Assisted Enrollment</label></div>
<button class="checkout-btn" type="button" id="continue">CONTINUE TO SECURE PAYMENT</button>
<p id="status" aria-live="polite"></p>
</section>
<aside class="checkout-card"><h2>ORDER SUMMARY</h2><div id="summary">Loading…</div></aside>
</div></main><footer data-site-footer></footer>
<script src="/Thesegunsamuel/js/site-shell.js"></script>
<script>
(function(){
 const raw=localStorage.getItem('segun_cart')||'[]';
 let items=[]; try{items=JSON.parse(raw)}catch(e){}
 document.getElementById('summary').innerHTML=items.length?items.map(i=>'<p><strong>'+i.title+'</strong><br>₦'+Number(i.price||0).toLocaleString()+' × '+Number(i.quantity||1)+'</p>').join(''):'<p>Your cart is empty.</p>';
 document.getElementById('continue').onclick=function(){
   document.getElementById('status').textContent='Payment integration boundary reached. Connect this action to the secure payment API in production.';
 };
})();
</script></body></html>
