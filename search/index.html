<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search the Ecosystem | Segun Samuel</title>
<meta name="description" content="Search the Segun Samuel knowledge ecosystem across courses, frameworks, ideas, learning paths, masterclasses, podcasts, case studies and applications.">
<link rel="canonical" href="/Thesegunsamuel/search/">
<style>
:root{--cream:#fdfaf4;--green:#003020;--deep:#0d3d28;--soft:#eaf5f1;--wine:#8c0d0c}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--green);font-family:Arial,sans-serif}
main{max-width:1180px;margin:auto;padding:64px 24px 90px}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;font-weight:700}
h1{font-family:Georgia,serif;font-size:clamp(2.4rem,6vw,4.8rem);line-height:1.02;margin:.4rem 0 1rem}
.intro{max-width:760px;font-size:1.08rem;line-height:1.7}
.searchbox{margin:34px 0 20px;display:flex;gap:12px}
input{width:100%;font:inherit;padding:17px 18px;border:2px solid var(--green);border-radius:8px;background:white;color:var(--green);outline:none}
input:focus{box-shadow:0 0 0 4px rgba(0,48,32,.15)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.filter{border:1px solid var(--green);background:white;color:var(--green);border-radius:999px;padding:9px 14px;cursor:pointer}
.filter[aria-pressed=true]{background:var(--green);color:white}
.status{margin:18px 0;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:white;border:1px solid rgba(0,48,32,.14);border-radius:12px;padding:22px;display:flex;flex-direction:column;min-height:230px}
.type{text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;font-weight:700}
.card h2{font-family:Georgia,serif;font-size:1.45rem;margin:.5rem 0}
.card p{line-height:1.55;color:#274d40;flex:1}
.card a{font-weight:700;color:var(--wine);text-decoration:none}
.empty{padding:30px;background:var(--soft);border-radius:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){main{padding:44px 16px}.grid{grid-template-columns:1fr}.searchbox{display:block}}
</style>
</head>
<body>
<main>
<div class="eyebrow">Segun Samuel · Knowledge Ecosystem</div>
<h1>Search the Ecosystem</h1>
<p class="intro">Explore the connected body of courses, frameworks, ideas, learning paths, masterclasses, podcasts, case studies, applications and other canonical knowledge entities.</p>
<div class="searchbox">
<label for="ecosystemSearch" style="position:absolute;left:-10000px">Search the ecosystem</label>
<input id="ecosystemSearch" type="search" autocomplete="off" placeholder="Search courses, frameworks, ideas, podcasts..." aria-describedby="searchStatus">
</div>
<div id="filters" class="filters" aria-label="Filter by type"></div>
<div id="searchStatus" class="status" aria-live="polite">Loading ecosystem…</div>
<section id="results" class="grid" aria-label="Search results"></section>
</main>
<script>
(() => {
  const DATA='/Thesegunsamuel/data/ecosystem-search.json';
  const input=document.getElementById('ecosystemSearch');
  const filters=document.getElementById('filters');
  const status=document.getElementById('searchStatus');
  const results=document.getElementById('results');
  let items=[], type='all', query='';

  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const path=r=>{
    if(!r)return '';
    if(/^https?:\/\//i.test(r))return r;
    return r.startsWith('/') ? r : '/Thesegunsamuel/'+r;
  };

  function score(e){
    const q=query.toLowerCase().trim();
    if(!q)return 0;
    const n=(e.name||'').toLowerCase(), t=(e.type||'').toLowerCase();
    const d=(e.short_definition||'').toLowerCase(), tags=(e.tags||[]).join(' ').toLowerCase();
    let s=0;
    if(n===q)s+=100; else if(n.startsWith(q))s+=60; else if(n.includes(q))s+=40;
    if(t.includes(q))s+=20;
    if(d.includes(q))s+=10;
    if(tags.includes(q))s+=8;
    return s;
  }

  function render(){
    let filtered=items.filter(e=>{
      const hay=[e.name,e.type,e.short_definition,e.long_definition,(e.tags||[]).join(' ')].join(' ').toLowerCase();
      return (!query || hay.includes(query.toLowerCase().trim())) && (type==='all'||e.type===type);
    });
    filtered.sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name));
    status.textContent=`${filtered.length} result${filtered.length===1?'':'s'}${query?` for “${query}”`:''}`;
    results.innerHTML=filtered.length?filtered.map(e=>`
      <article class="card">
        <div class="type">${esc(e.type)}</div>
        <h2>${esc(e.name)}</h2>
        <p>${esc(e.short_definition||'Explore this entity in the Segun Samuel knowledge ecosystem.')}</p>
        ${e.route?`<a href="${esc(path(e.route))}">OPEN →</a>`:`<span class="type">VIEW CONNECTIONS →</span>`}
      </article>`).join(''):'<div class="empty">No matching knowledge entities. Try a different search term or filter.</div>';
  }

  function buildFilters(){
    const types=[...new Set(items.map(e=>e.type))].sort();
    filters.innerHTML=`<button class="filter" aria-pressed="true" data-type="all">All</button>`+
      types.map(t=>`<button class="filter" aria-pressed="false" data-type="${esc(t)}">${esc(t.replace(/_/g,' '))}</button>`).join('');
    filters.addEventListener('click',ev=>{
      const b=ev.target.closest('[data-type]'); if(!b)return;
      type=b.dataset.type;
      filters.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      render();
    });
  }

  input.addEventListener('input',()=>{query=input.value;render()});
  fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()})
    .then(d=>{items=d.entities||[];buildFilters();render()})
    .catch(()=>{status.textContent='The ecosystem search index could not be loaded.'});
})();
</script>
</body>
</html>
