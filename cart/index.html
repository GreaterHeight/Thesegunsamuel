<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — SegunSamuel</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Segun<span>Samuel</span></a><nav class="nav-links"><a href="../courses/">Courses</a><a href="../frameworks/">Frameworks</a><a href="../explore/">Explore</a></nav></div></header>
<main><section class="page-hero"><div class="container"><div class="eyebrow">Enrollment</div><h1>Your course cart.</h1><p class="lead">Quantity can be adjusted before checkout. This static v1.3 cart is ready for later payment integration.</p></div></section>
<section class="section"><div class="container"><div id="cart-items" class="card-grid"></div><div class="card cart-summary"><h2>Total: <span id="cart-total">₦0</span></h2><div class="actions"><a class="btn btn-secondary" href="../courses/">Continue Learning</a><button class="btn btn-primary" id="checkout">Continue to Checkout</button></div></div></div></section></main>
<script>
const courses = [{"slug": "advanced-data-analytics-power-bi", "title": "Advanced Data Analytics & Power BI", "domain": "Technology & Digital Intelligence", "price": "\u20a6450,000"}, {"slug": "pattern-intelligence", "title": "Pattern Intelligence", "domain": "Intelligence & Thinking", "price": "\u20a6300,000"}, {"slug": "strategic-foresight", "title": "Strategic Foresight", "domain": "Strategy & Foresight", "price": "\u20a6350,000"}, {"slug": "leadership-intelligence", "title": "Leadership Intelligence", "domain": "Leadership & Human Systems", "price": "\u20a6325,000"}, {"slug": "systems-strategic-architecture", "title": "Systems & Strategic Architecture", "domain": "Systems & Strategic Architecture", "price": "\u20a6375,000"}, {"slug": "execution-intelligence", "title": "Execution Intelligence", "domain": "Execution & Delivery", "price": "\u20a6275,000"}, {"slug": "institutional-intelligence", "title": "Institutional Intelligence", "domain": "Institutions & Organisations", "price": "\u20a6350,000"}, {"slug": "ai-for-strategic-capability", "title": "AI for Strategic Capability", "domain": "Technology & Digital Intelligence", "price": "\u20a6250,000"}];
const params=new URLSearchParams(location.search), slug=params.get('course');
let cart=JSON.parse(localStorage.getItem('ss_cart')||'[]');
if(slug && !cart.some(x=>x.slug===slug)){const c=courses.find(x=>x.slug===slug);if(c)cart.push({slug:c.slug,qty:1});localStorage.setItem('ss_cart',JSON.stringify(cart));}
function render(){const box=document.getElementById('cart-items');let total=0;box.innerHTML=cart.map(item=>{const c=courses.find(x=>x.slug===item.slug);if(!c)return '';total+=Number(c.price.replace(/[^0-9]/g,''))*item.qty;return `<article class="card"><div class="eyebrow">${c.domain}</div><h3>${c.title}</h3><p>${c.price} each</p><div class="quantity-control"><button onclick="changeQty('${c.slug}',-1)">−</button><strong>${item.qty}</strong><button onclick="changeQty('${c.slug}',1)">+</button></div></article>`}).join('')||'<div class="card"><h3>Your cart is empty.</h3><p>Choose a course to begin.</p></div>';document.getElementById('cart-total').textContent='₦'+total.toLocaleString();}
function changeQty(slug,d){const i=cart.find(x=>x.slug===slug);if(!i)return;i.qty=Math.max(1,i.qty+d);localStorage.setItem('ss_cart',JSON.stringify(cart));render();}
document.getElementById('checkout').onclick=()=>alert('Checkout integration is the next payment-stage implementation.');
render();
</script></body></html>
